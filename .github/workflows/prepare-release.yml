name: Prepare or preview release

on:
    workflow_dispatch:
        inputs:
            mode:
                description: "Open a reviewed release PR, or publish a prerelease from this branch"
                required: true
                type: choice
                options: [request, preview]
                default: request
            version:
                description: "Release version without v (for example 0.1.0 or 0.2.0-rc.1)"
                required: true
                type: string

concurrency:
    group: prepare-release-${{ inputs.mode }}-${{ inputs.version }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    preview:
        name: Publish a branch prerelease preview
        if: ${{ inputs.mode == 'preview' }}
        permissions:
            contents: write
            pull-requests: read
        uses: ./.github/workflows/publish-release.yml
        with:
            preview: true
            version: ${{ inputs.version }}

    prepare:
        name: Open a reviewable release PR
        if: ${{ inputs.mode != 'preview' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        env:
            RELEASE_VERSION: ${{ inputs.version }}
        steps:
            - name: Require the default branch
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  RELEASE_MODE: ${{ inputs.mode }}
              run: |
                  if [[ "$RELEASE_MODE" != request ]]; then
                      printf '%s\n' 'Mode must be request or preview.' >&2
                      exit 1
                  fi
                  if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
                      printf '%s\n' 'Request releases from the default branch.' >&2
                      exit 1
                  fi

            - name: Check out the default branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.repository.default_branch }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Install preparation dependencies
              run: npm ci --ignore-scripts

            - name: Create an optional GitHub App token for automatic PR checks
              if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
              id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Create or find the release PR
              id: request
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
                  GH_REPO: ${{ github.repository }}
              run: npm run release:request -- "$RELEASE_VERSION"

            - name: Record review instructions
              env:
                  PR_URL: ${{ steps.request.outputs.url }}
                  USING_APP: ${{ steps.app-token.outputs.token != '' }}
              run: |
                  printf '## Release preparation\n\nReview: %s\n\nNo tag or release has been created. Review the version and notes, wait for required checks, and approve before merging.\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
                  if [[ "$USING_APP" != true ]]; then
                      printf '\nThis PR used GITHUB_TOKEN. Approve its pending Development build workflow runs if GitHub requests it; an App token enables automatic downstream checks.\n' >> "$GITHUB_STEP_SUMMARY"
                  fi
