name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Version already prepared and merged (for example 0.1.0 or 0.2.0-rc.1)"
                required: true
                type: string
    push:
        tags:
            - "v*"

# Serialize publishing and latest-link verification across versions.
concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        name: Verify and archive the release
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.release.outputs.tag }}
            commit: ${{ steps.release.outputs.commit }}
        env:
            RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        steps:
            - name: Check out the selected commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Validate release source and versions
              id: release
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  SOURCE_REF: ${{ github.ref }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  if [[ "$EVENT_NAME" == workflow_dispatch && "$SOURCE_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
                      printf '%s\n' 'Run manual releases from the default branch after merging the version change.' >&2
                      exit 1
                  fi
                  node scripts/package-release.mjs --check "$RELEASE_TAG"
                  printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
                  printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Verify source and release regression tests
              run: npm run verify

            - name: Build release assets
              run: npm run package:release -- "$RELEASE_TAG"

            - name: Verify the archive users will download
              run: |
                  (cd dist/releases && sha256sum --check SHA256SUMS)
                  mkdir -p "$RUNNER_TEMP/release-extracted"
                  tar -xzf "dist/releases/cyclecloud-mcp-${RELEASE_TAG#v}.tar.gz" -C "$RUNNER_TEMP/release-extracted"
                  npm run verify:package -- "$RUNNER_TEMP/release-extracted/cyclecloud-mcp"

            - name: Pass verified assets to the publishing job
              uses: actions/upload-artifact@v4
              with:
                  name: release-assets
                  path: |
                      dist/releases/*.tar.gz
                      dist/releases/install.sh
                      dist/releases/SHA256SUMS
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Create the tag and publish persistent assets
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            RELEASE_TAG: ${{ needs.build.outputs.tag }}
            RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        steps:
            - name: Check out the verified tag helper (no dependencies)
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.build.outputs.commit }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Download verified assets
              uses: actions/download-artifact@v4
              with:
                  name: release-assets
                  path: release-assets

            - name: Verify assets before creating a tag
              run: cd release-assets && sha256sum --check SHA256SUMS

            - name: Create or verify the tag at the exact built commit
              run: node scripts/tag-release.mjs "$RELEASE_TAG" "$RELEASE_COMMIT"

            # GITHUB_TOKEN-created tags do not trigger another push workflow.
            # Continue publishing in this run instead of relying on that event.
            - name: Create the release without replacing existing assets
              run: |
                  cd release-assets
                  flags=()
                  if [[ "$RELEASE_TAG" == *-* ]]; then
                      flags+=(--prerelease --latest=false)
                  fi
                  gh release create "$RELEASE_TAG" \
                      "cyclecloud-mcp-${RELEASE_TAG#v}.tar.gz" install.sh SHA256SUMS \
                      --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"

    post-release:
        name: Verify public curl installation
        needs: [build, publish]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            RELEASE_TAG: ${{ needs.build.outputs.tag }}
            RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        steps:
            - name: Check out the verification harness at the released commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.build.outputs.commit }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Install verification dependencies
              run: npm ci --ignore-scripts

            - name: Verify anonymous curl installation of this release
              run: npm run verify:release -- "$RELEASE_TAG" "$RELEASE_COMMIT"

            - name: Verify the latest installer when this is the latest stable release
              if: ${{ !contains(needs.build.outputs.tag, '-') }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
                  if [[ "$latest" == "$RELEASE_TAG" ]]; then
                      npm run verify:release -- "$RELEASE_TAG" "$RELEASE_COMMIT" --latest
                  else
                      printf 'Latest still points to %s; the version-pinned installation was verified.\n' "$latest" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Record post-release outcome
              if: ${{ always() }}
              env:
                  VERIFICATION_STATUS: ${{ job.status }}
              run: |
                  printf '## Release %s\n\nPost-release verification: **%s**\n' "$RELEASE_TAG" "$VERIFICATION_STATUS" >> "$GITHUB_STEP_SUMMARY"
                  printf '\nRelease: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
                  if [[ "$VERIFICATION_STATUS" != success ]]; then
                      printf '\nThe release is already published. Inspect the failure and rerun failed jobs; do not move the tag or overwrite assets.\n' >> "$GITHUB_STEP_SUMMARY"
                  fi
