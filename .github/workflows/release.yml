name: Release

# Publication is a consequence of merging a reviewed release PR, not a tag push
# or an independent manual request that could bypass that review gate.
on:
    pull_request:
        types: [closed]

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read
    pull-requests: read

jobs:
    build:
        name: Verify the merged release PR
        if: >-
            github.event.pull_request.merged == true &&
            github.event.pull_request.base.ref == github.event.repository.default_branch &&
            github.event.pull_request.base.repo.full_name == github.repository &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/v')
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.release.outputs.tag }}
            commit: ${{ steps.release.outputs.commit }}
            notes: ${{ steps.release.outputs.notes }}
        steps:
            - name: Check out the recorded merge commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.merge_commit_sha }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Validate approval, merged source, versions, and reviewed notes
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/release-pr-context.mjs

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Verify source and release regression tests
              run: npm run verify

            - name: Package the verified build for release
              env:
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
                  RELEASE_SOURCE_COMMIT: ${{ steps.release.outputs.commit }}
              run: |
                  node scripts/package-local.mjs
                  node scripts/package-release.mjs "$RELEASE_TAG"

            - name: Verify the archive users will download
              env:
                  RELEASE_TAG: ${{ steps.release.outputs.tag }}
              run: |
                  (cd dist/releases && sha256sum --check SHA256SUMS)
                  mkdir -p "$RUNNER_TEMP/release-extracted"
                  tar -xzf "dist/releases/cyclecloud-mcp-${RELEASE_TAG#v}.tar.gz" -C "$RUNNER_TEMP/release-extracted"
                  npm run verify:package -- "$RUNNER_TEMP/release-extracted/cyclecloud-mcp"

            - name: Pass verified assets to the publishing job
              uses: actions/upload-artifact@v4
              with:
                  name: release-assets
                  path: |
                      dist/releases/*.tar.gz
                      dist/releases/install.sh
                      dist/releases/SHA256SUMS
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Tag and publish the reviewed release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            RELEASE_TAG: ${{ needs.build.outputs.tag }}
            RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
            RELEASE_NOTES: ${{ needs.build.outputs.notes }}
        steps:
            - name: Check out the verified helpers and reviewed notes
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.build.outputs.commit }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Download verified assets
              uses: actions/download-artifact@v4
              with:
                  name: release-assets
                  path: release-assets

            - name: Verify assets before creating a tag
              run: cd release-assets && sha256sum --check SHA256SUMS

            - name: Create or verify the tag at the exact merged commit
              run: node scripts/tag-release.mjs "$RELEASE_TAG" "$RELEASE_COMMIT"

            # GITHUB_TOKEN-created tags do not trigger another push workflow.
            - name: Publish the reviewed notes and assets without overwriting a release
              run: |
                  flags=()
                  if [[ "$RELEASE_TAG" == *-* ]]; then
                      flags+=(--prerelease --latest=false)
                  fi
                  gh release create "$RELEASE_TAG" \
                      "release-assets/cyclecloud-mcp-${RELEASE_TAG#v}.tar.gz" \
                      release-assets/install.sh release-assets/SHA256SUMS \
                      --verify-tag --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES" "${flags[@]}"

    post-release:
        name: Verify public curl installation
        needs: [build, publish]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            RELEASE_TAG: ${{ needs.build.outputs.tag }}
            RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        steps:
            - name: Check out the verification harness at the released commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.build.outputs.commit }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm

            - name: Install verification dependencies
              run: npm ci --ignore-scripts

            - name: Verify anonymous curl installation of this release
              run: npm run verify:release -- "$RELEASE_TAG" "$RELEASE_COMMIT"

            - name: Verify the latest installer when this is the latest stable release
              if: ${{ !contains(needs.build.outputs.tag, '-') }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
                  if [[ "$latest" == "$RELEASE_TAG" ]]; then
                      npm run verify:release -- "$RELEASE_TAG" "$RELEASE_COMMIT" --latest
                  else
                      printf 'Latest still points to %s; the version-pinned installation was verified.\n' "$latest" >> "$GITHUB_STEP_SUMMARY"
                  fi

            - name: Record post-release outcome
              if: ${{ always() }}
              env:
                  VERIFICATION_STATUS: ${{ job.status }}
              run: |
                  printf '## Release %s\n\nPost-release verification: **%s**\n' "$RELEASE_TAG" "$VERIFICATION_STATUS" >> "$GITHUB_STEP_SUMMARY"
                  printf '\nRelease: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
                  if [[ "$VERIFICATION_STATUS" != success ]]; then
                      printf '\nThe release is already published. Inspect the failure and rerun failed jobs; do not move the tag or overwrite assets.\n' >> "$GITHUB_STEP_SUMMARY"
                  fi

    cleanup:
        name: Remove the completed release branch safely
        needs: [build, post-release]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
        steps:
            - name: Check out the verified cleanup helper
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.build.outputs.commit }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Delete only the unchanged merged branch
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/cleanup-release-branch.mjs
