name: Release

# Reviewed releases still require an approved PR merged into the default branch.
on:
    pull_request:
        types: [closed]

permissions:
    contents: read
    pull-requests: read

jobs:
    publish:
        name: Publish the reviewed release
        if: >-
            github.event.pull_request.merged == true &&
            github.event.pull_request.base.ref == github.event.repository.default_branch &&
            github.event.pull_request.base.repo.full_name == github.repository &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            startsWith(github.event.pull_request.head.ref, 'release/v')
        permissions:
            contents: write
            pull-requests: read
        uses: ./.github/workflows/publish-release.yml

    cleanup:
        name: Remove the completed release branch safely
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: read
        steps:
            - name: Check out the verified cleanup helper
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.publish.outputs.commit }}
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Delete only the unchanged merged branch
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/cleanup-release-branch.mjs
